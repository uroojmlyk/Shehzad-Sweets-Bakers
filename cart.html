<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Shehzad Sweets &amp; Bakers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           SHEHZAD SWEETS & BAKERS: MILA MIAMI INSPIRED
           Same design system as index, menu, services, deals pages
           ============================================================ */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background: #0A0807;
            color: #F5F0EB;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15.5px;
            line-height: 1.65;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        img {
            max-width: 100%;
            display: block;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        ul {
            list-style: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }
        input,
        textarea,
        select {
            font-family: inherit;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 800;
            line-height: 1.15;
            color: #FFFFFF;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #13100E;
        }
        ::-webkit-scrollbar-thumb {
            background: #C9A84C;
            border-radius: 8px;
        }

        .hide {
            display: none !important;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #C9A84C;
        }
        .eyebrow::before {
            content: '';
            width: 28px;
            height: 1.5px;
            background: #C9A84C;
            border-radius: 4px;
        }

        /* ── buttons (SQUARE, MILA style) ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            padding: 14px 32px;
            border-radius: 0;
            border: 1px solid transparent;
            transition: all 0.25s ease;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            min-width: 140px;
        }
        .btn svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        .btn-primary {
            background: #8B1A1A;
            color: #fff;
            box-shadow: 0 8px 24px -8px rgba(139, 26, 26, 0.5);
        }
        .btn-primary:hover {
            background: #6E1414;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(139, 26, 26, 0.6);
        }

        .btn-gold {
            background: #C9A84C;
            color: #0A0807;
            box-shadow: 0 8px 24px -8px rgba(201, 168, 76, 0.4);
        }
        .btn-gold:hover {
            background: #D4B85E;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(201, 168, 76, 0.5);
        }

        .btn-outline {
            border-color: rgba(245, 240, 235, 0.25);
            color: #F5F0EB;
            background: transparent;
        }
        .btn-outline:hover {
            border-color: #C9A84C;
            color: #C9A84C;
            background: rgba(201, 168, 76, 0.06);
        }

        .btn-sm {
            padding: 10px 20px;
            font-size: 12px;
            min-width: 100px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* ── HEADER ── */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(10, 8, 7, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201, 168, 76, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            max-width: 1180px;
            margin: 0 auto;
            gap: 16px;
            min-height: 76px;
        }

        /* ── Brand / Logo ── */
        .brand {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .brand-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
            filter: drop-shadow(0 0 20px rgba(201, 168, 76, 0.25)) drop-shadow(0 4px 30px rgba(0, 0, 0, 0.6));
        }
        .brand-logo:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 40px rgba(201, 168, 76, 0.45)) drop-shadow(0 8px 40px rgba(0, 0, 0, 0.7));
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .nav-links a {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #A89888;
            position: relative;
            padding: 6px 0;
            transition: color 0.2s ease;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #C9A84C;
        }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #C9A84C;
            border-radius: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .cart-btn {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 0;
            background: #1C1714;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(201, 168, 76, 0.2);
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }
        .cart-btn:hover {
            border-color: #C9A84C;
            background: rgba(201, 168, 76, 0.08);
            transform: scale(1.05);
        }
        .cart-btn svg {
            width: 22px;
            height: 22px;
            color: #C9A84C;
        }
        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #8B1A1A;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            width: 22px;
            height: 22px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(139, 26, 26, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.25);
        }

        .hamburger {
            display: none;
            width: 46px;
            height: 46px;
            border-radius: 0;
            background: #1C1714;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(201, 168, 76, 0.15);
            flex-shrink: 0;
            transition: border-color 0.2s ease;
        }
        .hamburger:hover {
            border-color: #C9A84C;
        }
        .hamburger svg {
            width: 22px;
            height: 22px;
            color: #C9A84C;
        }

        .mobile-nav {
            display: none;
            flex-direction: column;
            background: #13100E;
            border-top: 1px solid rgba(201, 168, 76, 0.06);
            padding: 8px 24px 22px;
            max-width: 1180px;
            margin: 0 auto;
        }
        .mobile-nav a {
            padding: 14px 2px;
            font-size: 15px;
            font-weight: 600;
            color: #F5F0EB;
            border-bottom: 1px solid rgba(201, 168, 76, 0.05);
        }
        .mobile-nav a.active {
            color: #C9A84C;
        }
        .mobile-nav .btn {
            margin-top: 16px;
        }
        body.nav-open .mobile-nav {
            display: flex;
        }

        /* ── PAGE HERO ── */
        .page-hero {
            padding: 70px 0 56px;
            background:
                radial-gradient(circle at 12% 20%, rgba(139, 26, 26, 0.18), transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(201, 168, 76, 0.08), transparent 40%);
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            text-align: center;
        }
        .page-hero .eyebrow {
            justify-content: center;
        }
        .page-hero h1 {
            font-size: clamp(34px, 5vw, 52px);
            margin-top: 16px;
        }
        .page-hero p {
            margin-top: 14px;
            color: #A89888;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
            font-size: 15.5px;
        }

        /* ── Sections ── */
        .section {
            padding: 78px 0;
        }
        .section-alt {
            background: #13100E;
        }

        /* ── Cart Table ── */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }
        .cart-table th {
            text-align: left;
            font-size: 11.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #A89888;
            padding: 0 0 14px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            font-weight: 600;
        }
        .cart-table td {
            padding: 16px 0;
            border-bottom: 1px solid rgba(201, 168, 76, 0.06);
            font-size: 14.5px;
            vertical-align: middle;
        }
        .cart-item-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-item-name img {
            width: 52px;
            height: 52px;
            border-radius: 0;
            object-fit: cover;
            background: #13100E;
        }
        .cart-item-name div strong {
            color: #FFFFFF;
        }
        .cart-item-name div>div {
            font-size: 12px;
            color: #A89888;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-control button {
            width: 26px;
            height: 26px;
            border-radius: 0;
            background: #13100E;
            border: 1px solid rgba(201, 168, 76, 0.08);
            color: #F5F0EB;
            font-weight: 700;
            font-size: 15px;
            transition: border-color 0.2s ease;
        }
        .qty-control button:hover {
            border-color: #C9A84C;
        }
        .qty-control span {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
        }

        .remove-btn {
            color: #8B1A1A;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }
        .remove-btn:hover {
            color: #8B1A1A;
        }
        .remove-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ── Cart Summary ── */
        .cart-summary {
            background: #1C1714;
            border: 1px solid rgba(201, 168, 76, 0.06);
            border-radius: 0;
            padding: 28px 30px;
            margin-top: 0;
            max-width: 420px;
            margin-left: auto;
        }
        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            color: #A89888;
            padding: 9px 0;
        }
        .cart-summary-row.total {
            color: #FFFFFF;
            font-size: 19px;
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            border-top: 1px solid rgba(201, 168, 76, 0.08);
            margin-top: 8px;
            padding-top: 16px;
        }
        .cart-summary-row.total span:last-child {
            color: #C9A84C;
        }
        .min-order-note {
            font-size: 12.5px;
            color: #C9A84C;
            margin-top: 10px;
            display: none;
        }
        .min-order-note.show {
            display: block;
        }

        .cart-empty {
            text-align: center;
            padding: 70px 0;
            color: #A89888;
        }
        .cart-empty svg {
            width: 56px;
            height: 56px;
            color: #5A4D42;
            margin: 0 auto 18px;
        }
        .cart-empty p {
            margin-bottom: 10px;
        }

        /* ── CTA band ── */
        .cta-band {
            background: linear-gradient(135deg, #8B1A1A 0%, #5E1111 100%);
            padding: 72px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .cta-band::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(201, 168, 76, 0.06), transparent 60%);
            pointer-events: none;
        }
        .cta-band h2 {
            color: #fff;
            font-size: clamp(30px, 4.6vw, 46px);
            position: relative;
        }
        .cta-band p {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 12px;
            font-size: 15.5px;
            position: relative;
        }
        .cta-band .btn {
            margin-top: 28px;
            position: relative;
        }

        /* ── Footer ── */
        footer {
            background: #13100E;
            border-top: 1px solid rgba(201, 168, 76, 0.06);
            padding: 60px 0 28px;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr;
            gap: 40px;
            padding-bottom: 36px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.06);
        }
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .footer-brand .brand-logo {
            height: 64px;
            width: auto;
            filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.4));
        }
        .footer-col p {
            color: #A89888;
            font-size: 13.5px;
            line-height: 1.7;
            max-width: 260px;
        }
        .footer-col h5 {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #C9A84C;
            margin-bottom: 16px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
        }
        .footer-col a {
            display: block;
            font-size: 13.5px;
            color: #A89888;
            padding: 5px 0;
            transition: color 0.2s ease;
        }
        .footer-col a:hover {
            color: #C9A84C;
        }
        .footer-social {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .footer-social a {
            width: 38px;
            height: 38px;
            border-radius: 0;
            background: #1C1714;
            border: 1px solid rgba(201, 168, 76, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .footer-social a:hover {
            border-color: #C9A84C;
            background: rgba(201, 168, 76, 0.06);
        }
        .footer-social a svg {
            width: 16px;
            height: 16px;
            color: #C9A84C;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 22px;
            font-size: 12px;
            color: #5A4D42;
        }

        /* ── WhatsApp FAB ── */
        .wa-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 300;
            width: 60px;
            height: 60px;
            border-radius: 0;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 32px -10px rgba(37, 211, 102, 0.55);
            transition: transform 0.2s ease;
            animation: pulse 2.8s ease-in-out infinite;
        }
        .wa-fab:hover {
            transform: scale(1.05);
        }
        .wa-fab svg {
            width: 30px;
            height: 30px;
            color: #fff;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 96px;
            right: 24px;
            z-index: 400;
            background: #1C1714;
            border: 1px solid #C9A84C;
            color: #F5F0EB;
            padding: 14px 22px;
            border-radius: 0;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.7);
            transform: translateY(16px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ── Responsive ── */
        @media (max-width: 980px) {
            .nav-links {
                display: none;
            }
            .header-actions .cart-btn {
                display: flex;
            }
            .header-actions .wa-order-link {
                display: none;
            }
            .header-actions {
                gap: 10px;
            }
            .hamburger {
                display: flex;
            }
            .header-row {
                padding: 9px 20px;
                min-height: 68px;
            }
            .brand-logo {
                height: 52px;
            }
            .cart-btn,
            .hamburger {
                width: 44px;
                height: 44px;
            }
            .cart-btn svg,
            .hamburger svg {
                width: 20px;
                height: 20px;
            }
            .cart-count {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            .footer-brand .brand-logo {
                height: 56px;
            }
            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 30px;
            }
            .cart-summary {
                max-width: 100%;
                margin-left: 0;
            }
        }

        @media (max-width: 640px) {
            .footer-grid {
                grid-template-columns: 1fr;
            }
            .page-hero h1 {
                font-size: clamp(28px, 8vw, 38px);
            }
            .page-hero p {
                font-size: 14px;
            }
            .header-row {
                padding: 7px 14px;
                min-height: 60px;
                gap: 10px;
            }
            .brand-logo {
                height: 46px;
                max-width: 170px;
            }
            .cart-btn,
            .hamburger {
                width: 42px;
                height: 42px;
            }
            .cart-btn svg,
            .hamburger svg {
                width: 19px;
                height: 19px;
            }
            .cart-count {
                width: 19px;
                height: 19px;
                font-size: 9.5px;
            }
            .footer-brand .brand-logo {
                height: 50px;
            }
            .section {
                padding: 56px 0;
            }
            .cart-table thead {
                display: none;
            }
            .cart-table tr {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                padding: 14px 0;
                border-bottom: 1px solid rgba(201, 168, 76, 0.06);
            }
            .cart-table td {
                border: none;
                padding: 2px 0;
                width: 100%;
            }
            .cart-table td:last-child {
                width: auto;
                margin-left: auto;
            }
            .cart-item-name img {
                width: 40px;
                height: 40px;
            }
            .cart-summary {
                padding: 20px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 13px;
                min-width: 120px;
            }
            .cart-empty {
                padding: 40px 0;
            }
        }

        /* ── Table cell alignment fix ── */
        .cart-table td:last-child {
            text-align: right;
        }
        .cart-table td:first-child {
            width: 40%;
        }
        .cart-table td:nth-child(2),
        .cart-table td:nth-child(3) {
            width: 15%;
        }
        .cart-table td:nth-child(4) {
            width: 20%;
        }
        .cart-table td:last-child {
            width: 10%;
        }

        @media (max-width: 640px) {
            .cart-table td:first-child {
                width: 100%;
            }
            .cart-table td:nth-child(2),
            .cart-table td:nth-child(3),
            .cart-table td:nth-child(4),
            .cart-table td:last-child {
                width: auto;
            }
        }
    
    @media (max-width: 400px) {
      .header-row {
        padding: 6px 10px;
        min-height: 54px;
        gap: 8px;
      }
      .brand-logo {
        height: 40px;
        max-width: 140px;
      }
      .cart-btn,
      .hamburger {
        width: 38px;
        height: 38px;
      }
      .cart-btn svg,
      .hamburger svg {
        width: 17px;
        height: 17px;
      }
      .cart-count {
        width: 17px;
        height: 17px;
        font-size: 8.5px;
      }
      .footer-brand .brand-logo {
        height: 44px;
      }
    }


    @media (max-width: 640px) {
      .page-hero {
        padding: 40px 0 32px;
      }
    }

  </style>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='29' fill='%238B1A1A' stroke='%23C9A84C' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>

    <div id="icon-sprite"></div>
    <header id="site-header" class="site-header"></header>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <div class="container">
            <span class="eyebrow">Your Order</span>
            <h1>Cart</h1>
            <p>Review your items, then send the order straight to us on WhatsApp.</p>
        </div>
    </section>

    <!-- CART -->
    <section class="section">
        <div class="container">

            <div class="cart-empty" id="cartEmpty">
                <svg><use href="#ic-cart" /></svg>
                <p>Your cart is empty.</p>
                <a href="menu.html" class="btn btn-primary" style="margin-top:18px;">Browse Menu <svg><use href="#ic-arrow" /></svg></a>
            </div>

            <div id="cartTableWrap" class="hide" style="margin-bottom:30px;overflow-x:auto;">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody"></tbody>
                </table>
            </div>

            <div id="cartSummary" class="cart-summary hide">
                <div class="cart-summary-row">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">Rs 0</span>
                </div>
                <div class="cart-summary-row total">
                    <span>Total</span>
                    <span id="cartTotal">Rs 0</span>
                </div>
                <p id="minOrderNote" class="min-order-note"></p>
                <button id="checkoutBtn" class="btn btn-primary btn-block" style="margin-top:20px;">
                    <svg><use href="#ic-whatsapp" /></svg>Checkout on WhatsApp
                </button>
                <button onclick="clearCart()" class="btn btn-outline btn-block" style="margin-top:10px;">
                    Clear Cart
                </button>
            </div>

        </div>
    </section>

    <!-- CTA -->
    <section class="cta-band">
        <div class="container">
            <h2>Hungry for more?</h2>
            <p>Browse our full menu and add more items to your order.</p>
            <a href="menu.html" class="btn btn-gold">View Full Menu <svg><use href="#ic-arrow" /></svg></a>
        </div>
    </section>

    <footer id="site-footer"></footer>

    <script>
        /* ============================================================
           BRAND CONFIG
           ============================================================ */

        const BRAND = {
            name: "Shehzad Sweets & Bakers",
            tagline: "The Taste You Never Forget",
            phone: "03043737337",
            whatsapp: "923043737337",
            address: "Dhobi Bazar, Gogera Plaza, Near Ahl-e-Hadis Chowk, Bangla Gogera",
            minOrder: 500,
            facebook: "https://facebook.com/",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Shehzad+Sweets+Bakers+Dhobi+Bazar+Gogera+Plaza+Bangla+Gogera"
        };

        /* ============================================================
           SHARED LAYOUT: header, footer, icon sprite, WhatsApp FAB
           ============================================================ */

        const ICON_SPRITE = `
        <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
          <symbol id="ic-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></symbol>
          <symbol id="ic-whatsapp" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.29-.15-1.7-.84-1.96-.93-.26-.1-.46-.15-.65.15-.2.29-.75.93-.92 1.12-.17.2-.34.22-.63.08-.29-.15-1.22-.45-2.33-1.44-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.08-.15-.65-1.58-.9-2.16-.24-.58-.48-.5-.65-.5-.17-.01-.37-.01-.56-.01-.2 0-.52.07-.79.37-.27.29-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.7-.7 1.94-1.37.24-.68.24-1.25.17-1.37-.07-.12-.26-.2-.55-.34z"/><path d="M12 2a10 10 0 00-8.6 15.03L2 22l5.11-1.34A10 10 0 1012 2zm0 18.13a8.09 8.09 0 01-4.14-1.13l-.3-.18-3.08.81.82-3-.19-.31A8.13 8.13 0 1112 20.13z"/></symbol>
          <symbol id="ic-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
          <symbol id="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
          <symbol id="ic-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></symbol>
          <symbol id="ic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
          <symbol id="ic-fb" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 10-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.5-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0022 12z"/></symbol>
          <symbol id="ic-bike" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5.5 17.5L9 8h5l3 5.5M9 8L7 5H4"/><path d="M12 8l3 5.5h3.5"/></symbol>
          <symbol id="ic-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01z"/></symbol>
          <symbol id="ic-fire" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a3 3 0 006 0c0-1-.5-2-1-2 2 1 4 3.5 4 6.5A7 7 0 015 13.5C5 9 8 7 8 4c1.5 1 2 2.5 1.5 4C10.5 5.5 11 3.5 12 2z"/></symbol>
          <symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></symbol>
          <symbol id="ic-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
        </defs>
        </svg>`;

        function navLink(href, label) {
            const current = window.location.pathname.split('/').pop() || 'index.html';
            const isActive = current === href ? ' class="active"' : '';
            return `<a href="${href}"${isActive}>${label}</a>`;
        }

        function buildHeader() {
            const links = [
                ['index.html', 'Home'],
                ['menu.html', 'Menu'],
                ['deals.html', 'Deals'],
                ['cakes.html', 'Custom Cakes'],
                ['services.html', 'Services'],
                ['about.html', 'About'],
                ['contact.html', 'Contact']
            ];
            return `
          <div class="header-row">
            <a href="index.html" class="brand">
              <img src="shehzad-logo.webp" alt="Shehzad Sweets &amp; Bakers: The Taste You Never Forget" class="brand-logo" />
            </a>
            <nav class="nav-links">${links.map(l => navLink(l[0], l[1])).join('')}</nav>
            <div class="header-actions">
              <a href="cart.html" class="cart-btn" aria-label="Cart"><svg><use href="#ic-cart"/></svg><span class="cart-count" id="cartCountBadge">0</span></a>
              <a href="#" class="btn btn-primary btn-sm wa-order-link"><svg><use href="#ic-whatsapp"/></svg>Order</a>
              <button class="hamburger" id="hamburgerBtn" aria-label="Menu"><svg><use href="#ic-menu"/></svg></button>
            </div>
          </div>
          <div class="mobile-nav" id="mobileNav">
            ${links.map(l => navLink(l[0], l[1])).join('')}
            <a href="cart.html">🛒 Cart (<span id="cartCountBadgeMobile">0</span>)</a>
            <a href="#" class="btn btn-primary btn-block wa-order-link"><svg><use href="#ic-whatsapp"/></svg>Order on WhatsApp</a>
          </div>`;
        }

        function buildFooter() {
            return `
          <div class="container">
            <div class="footer-grid">
              <div class="footer-col">
                <div class="footer-brand">
                  <img src="shehzad-logo.webp" alt="Shehzad Sweets &amp; Bakers" class="brand-logo" />
                </div>
                <p>Fresh pizza, burgers, shawarma, wings and family deals: fried and baked fresh, delivered hot across Bangla Gogera.</p>
                <div class="footer-social">
                  <a href="${BRAND.facebook}" target="_blank" aria-label="Facebook"><svg><use href="#ic-fb"/></svg></a>
                  <a href="https://wa.me/${BRAND.whatsapp}" target="_blank" aria-label="WhatsApp"><svg><use href="#ic-whatsapp"/></svg></a>
                </div>
              </div>
              <div class="footer-col">
                <h5>Explore</h5>
                <a href="menu.html">Full Menu</a>
                <a href="deals.html">Value Deals</a>
                <a href="cakes.html">Custom Cakes</a>
                <a href="services.html">Services</a>
              </div>
              <div class="footer-col">
                <h5>Company</h5>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Your Cart</a>
              </div>
              <div class="footer-col">
                <h5>Get In Touch</h5>
                <a href="tel:+${BRAND.phone}">📞 ${BRAND.phone}</a>
                <a href="https://wa.me/${BRAND.whatsapp}" target="_blank">💬 WhatsApp Order</a>
                <p style="margin-top:6px;">${BRAND.address}</p>
              </div>
            </div>
            <div class="footer-bottom">
              <span>© 2026 Shehzad Sweets &amp; Bakers. All rights reserved.</span>
              <span>${BRAND.tagline}</span>
            </div>
          </div>`;
        }

        function initLayout() {
            document.getElementById('icon-sprite').innerHTML = ICON_SPRITE;
            document.getElementById('site-header').innerHTML = buildHeader();
            document.getElementById('site-footer').innerHTML = buildFooter();

            const fab = document.createElement('a');
            fab.href =
                `https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent('Hi Shehzad Sweets & Bakers! I want to place an order.')}`;
            fab.target = '_blank';
            fab.className = 'wa-fab';
            fab.setAttribute('aria-label', 'Order on WhatsApp');
            fab.innerHTML = '<svg><use href="#ic-whatsapp"/></svg>';
            document.body.appendChild(fab);

            document.querySelectorAll('.wa-order-link').forEach(a => {
                a.href =
                    `https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent('Hi Shehzad Sweets & Bakers! I want to place an order.')}`;
                a.target = '_blank';
            });

            const hb = document.getElementById('hamburgerBtn');
            if (hb) {
                hb.addEventListener('click', () => {
                    document.body.classList.toggle('nav-open');
                    hb.innerHTML = document.body.classList.contains('nav-open') ?
                        '<svg><use href="#ic-close"/></svg>' :
                        '<svg><use href="#ic-menu"/></svg>';
                });
            }

            updateCartBadge();
        }

        document.addEventListener('DOMContentLoaded', initLayout);

        /* ============================================================
           CART & TOAST
           ============================================================ */

        const CART_KEY = 'sfp_cart';

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const count = getCart().reduce((sum, i) => sum + i.qty, 0);
            document.querySelectorAll('#cartCountBadge,#cartCountBadgeMobile').forEach(el => {
                if (el) el.textContent = count;
            });
        }

        function addToCart(item) {
            const cart = getCart();
            const existing = cart.find(i => i.id === item.id && i.variant === item.variant);
            if (existing) { existing.qty += 1; } else { cart.push({ id: item.id, name: item.name, variant: item.variant || '',
                    price: item.price, image: item.image, qty: 1 }); }
            saveCart(cart);
            showToast(`${item.name}${item.variant ? ' ('+item.variant+')' : ''} added to cart`);
        }

        function showToast(msg) {
            let toast = document.querySelector('.toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function waOrderLink(text) {
            return `https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent(text)}`;
        }

        function removeFromCart(id, variant) {
            saveCart(getCart().filter(i => !(i.id === id && i.variant === variant)));
            renderCartPage();
        }

        function changeQty(id, variant, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === id && i.variant === variant);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                saveCart(cart.filter(i => !(i.id === id && i.variant === variant)));
            } else {
                saveCart(cart);
            }
            renderCartPage();
        }

        function clearCart() {
            saveCart([]);
            renderCartPage();
        }

        /* ---------------- Cart page render ---------------- */
        function renderCartPage() {
            const tbody = document.getElementById('cartBody');
            if (!tbody) return;
            const cart = getCart();
            const emptyEl = document.getElementById('cartEmpty');
            const tableEl = document.getElementById('cartTableWrap');
            const summaryEl = document.getElementById('cartSummary');

            if (cart.length === 0) {
                emptyEl.classList.remove('hide');
                tableEl.classList.add('hide');
                summaryEl.classList.add('hide');
                return;
            }
            emptyEl.classList.add('hide');
            tableEl.classList.remove('hide');
            summaryEl.classList.remove('hide');

            tbody.innerHTML = cart.map(i => `
            <tr>
              <td>
                <div class="cart-item-name">
                  <img src="${i.image}" onerror="this.style.opacity=0.3" alt="${i.name}">
                  <div><strong>${i.name}</strong>${i.variant ? `<div>${i.variant}</div>` : ''}</div>
                </div>
              </td>
              <td>Rs ${i.price}</td>
              <td>
                <div class="qty-control">
                  <button onclick="changeQty('${i.id}','${i.variant}',-1)">−</button>
                  <span>${i.qty}</span>
                  <button onclick="changeQty('${i.id}','${i.variant}',1)">+</button>
                </div>
              </td>
              <td>Rs ${i.price * i.qty}</td>
              <td><button class="remove-btn" onclick="removeFromCart('${i.id}','${i.variant}')"><svg><use href="#ic-trash"/></svg></button></td>
            </tr>
          `).join('');

            const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('cartSubtotal').textContent = `Rs ${subtotal}`;
            document.getElementById('cartTotal').textContent = `Rs ${subtotal}`;

            const minNote = document.getElementById('minOrderNote');
            if (subtotal < BRAND.minOrder) {
                minNote.textContent = `Minimum order is Rs ${BRAND.minOrder} for home delivery. Add Rs ${BRAND.minOrder - subtotal} more.`;
                minNote.classList.add('show');
            } else {
                minNote.classList.remove('show');
            }

            document.getElementById('checkoutBtn').onclick = () => {
                let msg = `Hi Shehzad Sweets & Bakers! I want to order:\n\n`;
                cart.forEach(i => {
                    msg += `• ${i.name}${i.variant ? ' ('+i.variant+')' : ''} x${i.qty}: Rs ${i.price * i.qty}\n`;
                });
                msg += `\nTotal: Rs ${subtotal}\n\nPlease confirm my order and delivery time.`;
                window.open(waOrderLink(msg), '_blank');
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });
    </script>

</body>
</html>
